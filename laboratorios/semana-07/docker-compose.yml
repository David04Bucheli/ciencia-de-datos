# Infraestructura local del laboratorio.
#   docker compose up -d --build  -> construye la imagen de la tubería y levanta Kestra + Postgres
#   Kestra queda en http://localhost:8080
name: nyc-taxi-lab

volumes:
  postgres-data:
  kestra-data:

services:
  # Imagen con el código de ingesta + dbt. Se construye, imprime un mensaje y termina
  # (es normal verla como "Exited (0)"). Kestra la usa para ejecutar cada paso.
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: nyc-taxi-pipeline:latest
    env_file: .env
    command: ["python", "-c", "print('Imagen nyc-taxi-pipeline lista.')"]

  # Base de datos interna de Kestra (guarda flujos e historial de ejecuciones)
  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Orquestador
  kestra:
    image: kestra/kestra:v1.3
    user: "root"                 # necesita el socket de Docker para lanzar contenedores
    command: server standalone
    stop_grace_period: 6m
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ./kestra/flows:/app/flows  # Kestra carga los flujos de esta carpeta
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          server:
            basic-auth:
              username: "${KESTRA_ADMIN_USER:-admin@kestra.io}"
              password: "${KESTRA_ADMIN_PASSWORD:-Admin1234!}"
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          tutorial-flows:
            enabled: false
          url: http://localhost:8080/
        micronaut:
          io:
            watch:
              enabled: true
              paths:
                - /app/flows
      # Los flujos leen estas variables como {{ envs.snowflake_account }}, etc.
      # (Kestra expone en minúsculas las variables que empiezan con ENV_)
      ENV_SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      ENV_SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      ENV_SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      ENV_SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-NYC_TAXI_WH}
      ENV_SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-NYC_TAXI}
      ENV_SNOWFLAKE_AUTH_METHOD: ${SNOWFLAKE_AUTH_METHOD:-keypair}
      ENV_SNOWFLAKE_PRIVATE_KEY: ${SNOWFLAKE_PRIVATE_KEY:-}
      ENV_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:-}
      ENV_SNOWFLAKE_TOKEN: ${SNOWFLAKE_TOKEN:-}
      ENV_SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      ENV_TLC_START_MONTH: ${TLC_START_MONTH:-2025-01}
      ENV_TLC_END_MONTH: ${TLC_END_MONTH:-2026-08}
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      pipeline:
        condition: service_completed_successfully