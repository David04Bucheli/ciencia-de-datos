name: data-ml-infra
services:
#se separa lo de afuera y lo de adentro con indentación
#son claves únicas, no se repiten los nombres en un mismo nivel
  
  kestra-db:
  #kestra también necesita una base de datos, pero no la vamos a usar, solo es para que el contenedor funcione. Por eso no necesita puerto, es interna para el uso de kestra
    image: postgres:17-alpine
    environment:
    #idealmente, la inyectamos desde el .env. Por cuestión de tiempo no lo hago
      - POSTGRES_USER=kestra
      - POSTGRES_PASSWORD=kestra
      - POSTGRES_DB=proyecto
    volumes:
      - kestra-db-data:/var/lib/postgresql/data

  data-warehouse:
    image: postgres:17-alpine
    #postgres necesita configuraciones que están en las variables de entorno
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=proyecto
    #el puerto y la IP es lo que permite conectarnos (el socket)
    #no pueden colisionar los puertos por donde salgo en el resto de servicios
    ports: 
      #puerto por donde salgo: puerto del contenedor (host:contenedor)
      - 5433:5432
    volumes:
      #configuro volumen nativo de docker, 
      - warehouse-data:/var/lib/postgresql/data
  warehouse-ui:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - 5050:80
    #este servicio depende de la base de datos, por lo que se debe levantar primero
    depends_on:
      - data-warehouse
    volumes:
      - warehouse-ui-data:/var/lib/pgadmin

  #levantamos el orquestador
  kestra:
    image: kestra/kestra:v1.3.37
    #usuario que tiene acceso a todo
    user: "root"
    #comando para iniciar
    command: ["server", "standalone"]
    #cambio puertos para que no choque con el anterior
    ports:
      - "8080:8080"
    environment:
    #este es el warehouse del CLIENTE
      ENV_WAREHOUSE_HOST: data-warehouse
      #defino la BD donde van a llegar los datos, inyecto las variables de entorno que definí en el archivo .env
      ENV_WAREHOUSE_DB: ${WAREHOUSE_DB}
      ENV_WAREHOUSE_USER: ${WAREHOUSE_USER}
      ENV_WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
      #un archivo .env es donde se guardan datos sensibles, como contraseñas, para no exponerlos en el código
    
    #contenedor para almacenar los datos del orquestrador
      KESTRA_CONFIGURATION: |
          datasources:
            postgres:
              url: jdbc:postgresql://kestra-db:5432/kestra
              driver-class-name: org.postgresql.Driver
              username: kestra
              password: kestra
          
          kestra:
            server:
              basic-auth:
                enables: false

            repository:
              type: postgres

            queue:
              type: postgres

            storage:
              type: local
              local:
                base-path: /app/storage

            tasks:
              tmp-dir:
                path: /tmp/kestra-wd/tmp
            
            url: http://localhost:8080
  
    volumes:
      - kestra-storage:/app/storage
    
    depends_on:
      - kestra-db 


#aqui defino todos los volumes que uso arriba
volumes:
  warehouse-data:
  warehouse-ui-data:
  kestra-storage: 
  kestra-db-data:

#todo en docker compose ya está conectado a una red  